<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  <link rel="stylesheet" href="./css/main.css">
  <title>Frontend Mentor | Browser extensions manager UI</title>
  <link rel="stylesheet" href="./css/main.css">
</head>
<body>
  <div class="container">
      <header>
        <div class="logo">
          <img src="./assets/images/logo.svg" alt="logo">
        </div>

        <div class="theme">
          <button>
            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" fill="none" viewBox="0 0 22 22"><g clip-path="url(#a)"><path stroke="#FBFDFE" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.98" d="M11 1.833v1.834m0 14.666v1.834M3.667 11H1.833m3.955-5.212L4.492 4.492m11.72 1.296 1.297-1.296M5.788 16.215l-1.296 1.296m11.72-1.296 1.297 1.296M20.167 11h-1.834m-2.75 0a4.583 4.583 0 1 1-9.167 0 4.583 4.583 0 0 1 9.167 0Z"/></g><defs><clipPath id="a">
              <path fill="#fff" d="M0 0h22v22H0z"/></clipPath></defs>
            </svg>
          </button>
        </div>
      </header>

      <nav>
        <h1>Extensions List</h1>
        <div class="links">
          <button class="active">All</button>
          <button>Active</button>
          <button>Inactive</button>
        </div>
      </nav>

      <div class="root">
      </div>
      
      <footer class="attribution">
        Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
        Coded by <a href="#">MohamedsaberJP</a>.
      </footer>
  </div>

  <script src="./js/action.js"></script>
</body>
</html>
